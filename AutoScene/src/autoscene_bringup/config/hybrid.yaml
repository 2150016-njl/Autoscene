project:
  experiment_id: exp_hybrid_001
runtime:
  mode: hybrid
  world_state_hz: 10
  frame_id: map
scenario:
  source: unitraj_pluto
  dataset_type: tjwest
  dataset_path: ./data/TjEast_custom_0803
  history_source: initial
  scenario_index: 3
  eval_eps: 1
  auto_advance_scenario: false
  agent_assignment_mode: manual
  manual_platform_bv_count: 1
  manual_virtual_bv_count: 1
  initial_history_accel_mps2: 2.0
  pluto_history_dt_sec: 0.1
  pluto_history_steps: 21
  unitraj_root: ./src/autoscene_runtime/scripts/Autoscene_generator
  unitraj_config: ./src/autoscene_runtime/scripts/Autoscene_generator/unitraj/configs/config.yaml
  render: 2D
  save_render_png: false
  render_dir: ./outputs/render_hybrid_1
  render_every_n_steps: 1
  render_save_every_n_steps: 5
ego:
  id: ego_001
  execution_mode: simulation
  initial:
    x: 0.0
    y: 0.0
    heading: 0.0
    speed: 0.0
  external_timeout_ms: 300
  strict_external_feedback: true
  startup_timeout_sec: 10.0
  dropout_timeout_sec: 1.0
  origin:
    x: 0.0
    y: 0.0
    yaw: 0.0
platform:
  receive_udp: true
  send_udp: true
  emulate_controlled_feedback: false
  strict_actual_feedback: true
  local_ip: 192.168.88.3
  local_port: 31100
  send_rate_hz: 10
  packet_point_num: 50
  trajectory_dt_sec: 0.1
  earth_to_autoscene:
    tx: -658862.26492551
    ty: -3456013.515138761
    yaw: -0.012640032007
  platforms:
  - platform_id: platform_001
    vehicle_id: agent_001
    ip: 192.168.88.100
    send_port: 31000
    expected_remote_ip: 192.168.88.100
    expected_remote_port: -1
  - platform_id: platform_002
    vehicle_id: agent_002
    ip: 192.168.88.101
    send_port: 31000
    expected_remote_ip: 192.168.88.101
    expected_remote_port: -1
  trajectory_mode: pluto_replan
  startup_timeout_sec: 10.0
  dropout_timeout_sec: 1.0
  sim_state_timeout_sec: 1.0
  feedback_timeout_sec: 1.0
  target_timeout_sec: 1.0
  sender: 10
  version: 241
  message_id: 12
  expected_feedback_message_id: 1
  earth_to_autoscene_frame: reference_scenario
  calibration_reference_origin:
    x: -34.5073356628418
    y: 30.110946655273438
  calibration_reference_dataset: ./data/TjEast_custom_0803
algorithm:
  initial_history_accel_mps2: 2.0
  pluto_history_dt_sec: 0.1
  pluto_history_steps: 21
  save_pluto_trajectory_csv: true
  trajectory_csv_coordinate: G
  save_stitched_pluto_csv: true
  pluto_trajectory_csv_dir: outputs/pluto_trajectory_csv
vehicles:
  agents: []
evaluation:
  include_background_vehicles: true
  rate_hz: 10
  auto_export: true
  output_dir: ./outputs
  collision_distance_m: 0.0
  finalize_delay_sec: 0.5
  fail_on_invalid_platform: true
  platform_startup_grace_frames: 10
  max_consecutive_invalid_platform_frames: 3
record:
  enable_rosbag: true
  output_dir: ./outputs
  topics:
  - /autoscene/world/state
  - /autoscene/ego/state
  - /autoscene/ego/state_feedback
  - /autoscene/agents/state
  - /autoscene/agents/state_feedback
  - /autoscene/planning/trajectories
  - /autoscene/platform/target_trajectory
  - /autoscene/platform/command_trajectory
  - /autoscene/platform/trajectory_udp_payload
  - /autoscene/platform/state
  - /autoscene/platform/comm_status
  - /autoscene/platform/ads_udp_decoded
  - /autoscene/ego/adapter_status
  - /autoscene/scenario/status
  - /autoscene/simulation/status
  - /autoscene/evaluation/metrics
